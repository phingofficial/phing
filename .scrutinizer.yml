tools:
  external_code_coverage:
    timeout: 1200

filter:
  paths: ["src/Phing/*", "tests/bootstrap.php", "tests/Phing/*"]
  dependency_paths:
    - "vendor/"

checks:
  php:
    duplication: false

build:
  # PHP 8.4+ requires OpenSSL >= 1.1.1; use the Ubuntu 22.04 image.
  image: default-jammy
  dependencies:
    override:
      - COMPOSER_PROCESS_TIMEOUT=2000 composer install --no-interaction
  environment:
    timezone: UTC
    php:
      version: '8.5.12'
      ini:
        xdebug.mode: coverage
  nodes:
    analysis:
      tests:
        override:
          - 'php-scrutinizer-run --enable-security-analysis'
    tests:
      tests:
        override:
          - 'git config --global user.email "scrutinizer@phing.info" && git config --global user.name "Phing Scrutinizer Builder"'
          - 'cd tests && ../bin/phing'
